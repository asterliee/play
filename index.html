<style>
/* =====================================================================
   Asterlie — styles
   Light and dark themes share the tokens below.
   ===================================================================== */
:root {
  --bg: #F5F4F0;
  --bg-deep: #ECEAE3;
  --surface: #FFFFFF;
  --surface-2: #EFEDE7;
  --surface-3: #E4E1D8;
  --well: #E6E3DA;
  --ink: #1D2035;
  --ink-2: #5E6175;
  --ink-3: #737687;
  --line: rgba(29, 32, 53, .10);
  --line-2: rgba(29, 32, 53, .16);
  --primary: #2F3477;
  --primary-press: #252963;
  --primary-ink: #FFFFFF;
  --primary-soft: #E2E3F2;
  --accent: #2F3477;
  --primary-shadow: 0 6px 18px rgba(47, 52, 119, .22);
  --sage: #5F8C6A;
  --sage-soft: #DCEADF;
  --gold: #E8A93A;
  --gold-deep: #B57812;
  --gold-soft: #FBEBC4;
  --gold-glow: rgba(232, 169, 58, .45);
  --rose: #CF5A52;
  --rose-soft: #F7D9D5;
  --hint-bg: #FFF4DC;
  --hint-line: #F0D9A6;
  --scrim: rgba(20, 22, 48, .32);
  --shadow-1: 0 1px 2px rgba(29, 32, 53, .06), 0 4px 14px rgba(29, 32, 53, .08);
  --shadow-2: 0 2px 6px rgba(29, 32, 53, .08), 0 14px 36px rgba(29, 32, 53, .13);
  --tabbar: rgba(255, 255, 255, .9);
  /* board */
  --grid: rgba(29, 32, 53, .13);
  --mark: rgba(29, 32, 53, .52);
  --trail: #9599CF;
  --clash: #D9554C;
  --paper-cell: #FFFCF6;
  --paper-line: #2E3150;
  --dim: rgba(236, 234, 227, .45);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #17151C;
  --bg-deep: #121016;
  --surface: #221F28;
  --surface-2: #2B2732;
  --surface-3: #35303D;
  --well: #121016;
  --ink: #F1EFF4;
  --ink-2: #B3B0BC;
  --ink-3: #807D8A;
  --line: rgba(241, 239, 244, .09);
  --line-2: rgba(241, 239, 244, .16);
  --primary: #4A4F96;
  --primary-press: #40448A;
  --primary-ink: #EEEDF5;
  --primary-soft: #24223A;
  --accent: #A3A6D6;
  --primary-shadow: 0 4px 12px rgba(0, 0, 0, .35);
  --sage: #8DB898;
  --sage-soft: #22332A;
  --gold: #F2C25A;
  --gold-deep: #E0A53A;
  --gold-soft: #3A3121;
  --gold-glow: rgba(242, 194, 90, .55);
  --rose: #EE837A;
  --rose-soft: #3E2624;
  --hint-bg: #2C261A;
  --hint-line: #4A3E23;
  --scrim: rgba(5, 4, 8, .55);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, .35), 0 14px 36px rgba(0, 0, 0, .4);
  --tabbar: rgba(34, 31, 40, .9);
  --grid: rgba(241, 239, 244, .13);
  --mark: rgba(241, 239, 244, .72);
  --trail: #A9AEF5;
  --clash: #FF8A80;
  --paper-cell: #26222C;
  --paper-line: rgba(228, 226, 235, .7);
  --dim: rgba(18, 16, 22, .48);
  color-scheme: dark;
}

/* touch-action: no double-tap zoom anywhere. It is set on every element because iOS Safari doesn't
   carry it from body into scrolling areas (the tabs, sheets and welcome pages). */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
  overflow: hidden;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
svg { display: block; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.serif { font-family: var(--font-display); }
[hidden] { display: none !important; }

#app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; justify-content: center; background: var(--bg); }
.view {
  position: absolute; top: 0; bottom: 0; width: 100%; max-width: 480px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 96px);
  animation: viewIn .32s cubic-bezier(.2, .8, .3, 1) both;
}
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------------- top of tabs ---------------- */
.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.brand { display: flex; align-items: center; gap: 9px; flex: 1; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-txt { display: flex; flex-direction: column; min-width: 0; }
.wordmark { font-family: var(--font-display); font-weight: 800; font-size: 23px; line-height: 1.05; letter-spacing: -.6px; }
.tagline { font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-top: 2px; white-space: nowrap; }
.chip-streak { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border-radius: 17px; background: var(--surface); box-shadow: var(--shadow-1); font-weight: 600; font-size: 15px; }
.chip-streak svg { width: 17px; height: 17px; color: var(--gold-deep); }
.greet { margin: 18px 2px 4px; }
.greet h1 { font-family: var(--font-display); font-weight: 700; font-size: 31px; line-height: 1.12; margin: 0; letter-spacing: -.9px; }
.greet p { margin: 6px 0 0; color: var(--ink-2); font-size: 15.5px; }
.page-title { font-family: var(--font-display); font-weight: 700; font-size: 31px; margin: 10px 2px 14px; letter-spacing: -.9px; }

/* ---------------- cards ---------------- */
.card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-1); padding: 18px; margin-top: 14px; }
.card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.card-h h2 { font-family: var(--font-display); font-weight: 700; font-size: 21px; margin: 0; flex: 1; letter-spacing: -.35px; }
.card-h .aside { color: var(--ink-2); font-size: 14px; }
.eyebrow { font-size: 12.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.muted { color: var(--ink-2); }
.row-flex { display: flex; align-items: center; gap: 12px; }

.play-card { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; }
.play-card .thumb { width: 92px; height: 92px; flex: none; border-radius: 16px; overflow: hidden; }
.play-card .info { flex: 1; min-width: 0; }
.play-card .t1 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 2px 0 3px; }
.play-card .t2 { color: var(--ink-2); font-size: 14.5px; line-height: 1.35; }
.play-card .go { width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; flex: none; box-shadow: var(--primary-shadow); }
.play-card .go svg { width: 18px; height: 18px; }
.play-card .go.done { background: var(--sage-soft); color: var(--sage); box-shadow: none; }

.tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--surface-2); border-radius: 16px; padding: 4px; }
.tiers button { height: 40px; border-radius: 12px; font-size: 15px; font-weight: 500; color: var(--ink-2); transition: background .2s, color .2s, box-shadow .2s; }
.tiers button.sel { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: var(--shadow-1); }
.tier-note { display: flex; align-items: center; gap: 8px; margin: 10px 4px 2px; color: var(--ink-2); font-size: 14.5px; min-height: 22px; }
.pips { display: inline-flex; gap: 3px; flex: none; }
.pips i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); display: block; }
.pips i.on { background: var(--gold); }
.mode-row { display: flex; align-items: center; gap: 12px; padding: 14px 4px 4px; margin-top: 10px; border-top: 1px solid var(--line); }
.mode-row .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--ink); }
.mode-row .ic svg { width: 21px; height: 21px; }
.mode-row .txt { flex: 1; }
.mode-row .txt b { display: block; font-size: 16px; font-weight: 600; }
.mode-row .txt span { font-size: 13.5px; color: var(--ink-2); }

.btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; height: 54px; border-radius: 17px; font-size: 17px; font-weight: 650; transition: transform .14s, background .2s, opacity .2s; }
.btn svg { width: 20px; height: 20px; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: var(--primary-ink); box-shadow: var(--primary-shadow); }
.btn-primary:active { background: var(--primary-press); }
.btn-soft { background: var(--surface-2); color: var(--ink); }
.btn-text { background: none; color: var(--ink-2); height: 44px; font-weight: 500; }
.btn + .btn { margin-top: 10px; }
.mt { margin-top: 14px; }

/* switch */
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--surface-3); position: relative; transition: background .22s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .18); transition: transform .24s cubic-bezier(.3, .9, .3, 1.1); }
.switch.on { background: var(--sage); }
.switch.on::after { transform: translateX(20px); }

/* ---------------- tab bar ---------------- */
.tabbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; z-index: 15;
  display: flex; padding: 6px 10px calc(env(safe-area-inset-bottom) + 6px);
  background: var(--tabbar); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border-top: 1px solid var(--line);
}
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); border-radius: 14px; transition: color .2s; }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button.on { color: var(--accent); }

/* ---------------- game ---------------- */
#game { position: absolute; top: 0; bottom: 0; width: 100%; max-width: 480px; display: flex; flex-direction: column; background: var(--bg); z-index: 10; animation: gameIn .34s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes gameIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
.g-head { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 14px 4px; flex: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center; color: var(--ink); background: var(--surface); box-shadow: var(--shadow-1); flex: none; transition: transform .14s; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { transform: scale(.94); }
.g-title { flex: 1; min-width: 0; text-align: center; }
.g-title .t { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.1; }
.g-title .s { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; display: flex; gap: 7px; justify-content: center; align-items: center; min-height: 19px; }
.g-title .tags { display: inline-flex; gap: 6px; align-items: center; }
.g-title .tags:empty { display: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 7px; border-radius: 10px; font-size: 11.5px; font-weight: 650; letter-spacing: .2px; }
.tag svg { width: 12px; height: 12px; }
.tag-ink { background: var(--ink); color: var(--bg); }
.tag-daily { background: var(--gold-soft); color: var(--gold-deep); }
.timer { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.timer svg { width: 14px; height: 14px; opacity: .8; }
.timer.off { display: none; }
.g-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0; }
.board-card { background: var(--surface); border-radius: 26px; box-shadow: var(--shadow-2); padding: 9px; transition: width .25s, height .25s; flex: none; }
#board { touch-action: none; position: relative; width: 100%; height: 100%; }
#board svg { width: 100%; height: 100%; overflow: visible; }
.progress { display: flex; gap: 5px; margin-top: 14px; align-items: center; min-height: 18px; }
.progress span { display: inline-grid; place-items: center; width: 16px; height: 16px; }
.progress svg { width: 16px; height: 16px; display: block; }
.progress .p-off { color: var(--surface-3); }
.progress .p-on { transform: scale(1.12); }
.progress .p-new { animation: p-pop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes p-pop { 0% { transform: scale(.3); } 100% { transform: scale(1.12); } }
.g-tools { flex: none; display: flex; justify-content: space-around; padding: 6px 8px calc(env(safe-area-inset-bottom) + 10px); }
.tool { width: 74px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 0 5px; border-radius: 16px; color: var(--ink); font-size: 12px; font-weight: 600; transition: transform .14s, opacity .2s; }
.tool .tw { width: 48px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-1); }
.tool svg { width: 22px; height: 22px; }
.tool:disabled { opacity: .38; }
.tool:not(:disabled):active { transform: scale(.94); }
.tool.hint .tw { background: var(--gold-soft); color: var(--gold-deep); }
.tool.on .tw { background: var(--gold); color: #3A2A10; }

.hint-card { width: calc(100% - 28px); margin-top: 12px; background: var(--hint-bg); border: 1px solid var(--hint-line); border-radius: 20px; padding: 13px 14px 11px; color: var(--ink); animation: cardUp .3s cubic-bezier(.2, .9, .3, 1) both; flex: none; }
@keyframes cardUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.hint-top { display: flex; gap: 10px; }
.hint-top svg { width: 22px; height: 22px; color: var(--gold-deep); flex: none; margin-top: 1px; }
.hint-text { font-size: 15.5px; line-height: 1.38; }
.hint-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.hint-chip { font-size: 12px; font-weight: 650; color: var(--gold-deep); background: var(--gold-soft); border-radius: 9px; padding: 3px 9px; }
.hint-foot .sp { flex: 1; }
.pill { height: 36px; padding: 0 16px; border-radius: 18px; font-size: 15px; font-weight: 600; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.pill.primary { background: var(--primary); color: var(--primary-ink); box-shadow: none; }
.pill.ghost { background: none; box-shadow: none; color: var(--ink-2); padding: 0 8px; }

/* ---------------- sheets ---------------- */
.scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 30; }
.scrim.show { opacity: 1; pointer-events: auto; }
.scrim.light { background: rgba(20, 22, 48, .06); }
.sheet {
  position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 480px; z-index: 40;
  transform: translate(-50%, 105%); transition: transform .42s cubic-bezier(.2, .9, .25, 1);
  background: var(--surface); border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(20, 22, 48, .18);
  max-height: calc(100% - env(safe-area-inset-top) - 30px); display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.show { transform: translate(-50%, 0); }
.sheet:not(.show) { visibility: hidden; transition: transform .42s cubic-bezier(.2, .9, .25, 1), visibility 0s .42s; }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 9px auto 2px; flex: none; }
.sheet-body { overflow-y: auto; padding: 12px 20px 22px; -webkit-overflow-scrolling: touch; }
.sheet h2 { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 6px 0 4px; letter-spacing: -.2px; }
.sheet .lead { color: var(--ink-2); font-size: 15.5px; line-height: 1.45; margin: 4px 0 14px; }
.center { text-align: center; }
.menu-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 6px; font-size: 17px; border-bottom: 1px solid var(--line); text-align: left; }
.menu-item:last-child { border-bottom: 0; }
.menu-item svg { width: 22px; height: 22px; color: var(--ink-2); }

.solved-art { width: 120px; height: 84px; margin: 4px auto 0; }
.badges { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 10px 0 4px; }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 14px; font-size: 13.5px; font-weight: 650; }
.badge svg { width: 14px; height: 14px; }
.badge.gold { background: var(--gold-soft); color: var(--gold-deep); }
.badge.sage { background: var(--sage-soft); color: var(--sage); }
.badge.ink { background: var(--ink); color: var(--bg); }
.badge.rose { background: var(--rose-soft); color: var(--rose); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 16px; }
.fact { background: var(--surface-2); border-radius: 16px; padding: 11px 6px 9px; text-align: center; }
.fact b { display: block; font-family: var(--font-num); font-size: 21px; font-variant-numeric: tabular-nums; }
.fact span { font-size: 12px; color: var(--ink-2); }
.new-best { color: var(--gold-deep); font-weight: 700; }
.unlock { display: flex; gap: 10px; align-items: center; background: var(--gold-soft); border-radius: 16px; padding: 10px 12px; margin: -4px 0 14px; text-align: left; }
.unlock svg { width: 34px; height: 34px; flex: none; }
.unlock b { display: block; font-size: 15px; }
.unlock span { font-size: 13px; color: var(--ink-2); }

/* ---------------- settings & lists ---------------- */
.group-label { font-size: 13px; font-weight: 650; color: var(--ink-2); letter-spacing: .4px; text-transform: uppercase; margin: 24px 6px 8px; }
.list { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-1); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 9px 14px 9px 16px; position: relative; width: 100%; text-align: left; font-size: 16px; }
.li + .li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.li .lbl { flex: 1; min-width: 0; }
.li .sub { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.3; }
.li .val { color: var(--ink-2); }
.li > svg { width: 20px; height: 20px; color: var(--ink-2); flex: none; }
.mini-seg { display: flex; background: var(--surface-2); border-radius: 11px; padding: 3px; flex: none; }
.mini-seg button { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: var(--ink-2); font-weight: 500; }
.mini-seg button.sel { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: var(--shadow-1); }
.pick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pick { background: var(--surface); border-radius: 18px; padding: 8px 7px 7px; box-shadow: var(--shadow-1); text-align: center; border: 2px solid transparent; transition: border-color .2s, transform .14s; min-width: 0; }
.pick:active { transform: scale(.96); }
.pick.sel { border-color: var(--accent); }
.pick .pv { width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; }
.pick .pv svg { width: 100%; height: 100%; }
.pick .pv.pc { background: var(--surface-2); display: grid; place-items: center; }
.pick .pv.pc svg { width: 64%; height: 64%; }
.pick .nm { display: block; font-size: 13.5px; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-grid.sm .pick { padding: 6px 5px 5px; border-radius: 16px; }
.pick-grid.sm .pv { width: 50px; margin: 0 auto; border-radius: 10px; }
.pick-grid.sm .nm { font-size: 12.5px; margin-top: 4px; }
.qrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
.pc-row { display: flex; gap: 6px; }
.pc-btn { width: 42px; height: 42px; border-radius: 13px; background: var(--surface); box-shadow: var(--shadow-1); display: grid; place-items: center; border: 2px solid transparent; transition: border-color .2s, transform .14s; }
.pc-btn:active { transform: scale(.94); }
.pc-btn.sel { border-color: var(--accent); }
.pc-btn svg { width: 26px; height: 26px; }
.sheet h2.sheet-h { font-size: 22px; margin: 2px 0 12px; }
.note { font-size: 13.5px; color: var(--ink-2); margin: 10px 8px 0; line-height: 1.45; }

/* ---------------- stats ---------------- */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-1); padding: 14px 15px 13px; }
.tile .k { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.tile .k svg { width: 16px; height: 16px; color: var(--gold-deep); }
.tile .v { font-family: var(--font-num); font-size: 32px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 4px; line-height: 1.05; }
.tile .s { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.cal-head { display: flex; align-items: center; gap: 6px; }
.cal-head h2 { flex: 1; }
.cal-nav { width: 34px; height: 34px; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; }
.cal-nav svg { width: 16px; height: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dow { font-size: 11.5px; color: var(--ink-3); font-weight: 650; padding-bottom: 4px; }
.cal .d { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; font-size: 13px; color: var(--ink-2); position: relative; font-family: var(--font-num); }
.cal .d.solved { background: var(--gold-soft); color: var(--gold-deep); font-weight: 700; }
.cal .d.daily svg { position: absolute; width: 11px; height: 11px; top: 3px; right: 3px; color: var(--gold); }
.cal .d.today { box-shadow: inset 0 0 0 2px var(--accent); color: var(--ink); font-weight: 700; }
.cal .d.future { opacity: .35; }
.legend { display: flex; gap: 14px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; background: var(--gold-soft); }
.legend i.t { background: none; box-shadow: inset 0 0 0 2px var(--accent); }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 96px; margin: 14px 0 0; padding: 0 2px; border-bottom: 1.5px solid var(--line-2); }
.bars .b { flex: 0 1 20px; border-radius: 7px 7px 2px 2px; background: var(--surface-3); min-height: 6px; position: relative; transition: height .4s cubic-bezier(.2, .9, .3, 1); }
.bars-cap { font-size: 12.5px; color: var(--ink-3); margin: 7px 2px 0; }
.bars .b.best { background: var(--gold); }
.bars .b.ink::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); transform: translateX(-50%); opacity: .55; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.kv div { background: var(--surface-2); border-radius: 14px; padding: 9px 4px; text-align: center; }
.kv b { display: block; font-family: var(--font-num); font-size: 18px; font-variant-numeric: tabular-nums; }
.kv span { font-size: 12px; color: var(--ink-2); }
.empty { color: var(--ink-3); font-size: 14px; text-align: center; padding: 18px 8px 8px; }
.ms-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.ms { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 16px; padding: 10px; }
.ms svg { width: 36px; height: 36px; flex: none; }
.ms b { display: block; font-size: 14px; }
.ms span { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.25; }
.ms.locked { opacity: .5; }
.ms.locked svg { filter: grayscale(1); opacity: .6; }
.recent .li { min-height: 50px; }
.recent .when { font-size: 12.5px; color: var(--ink-3); }

/* ---------------- learn ---------------- */
.lesson-card { display: flex; gap: 14px; align-items: center; }
.lesson-card .thumb { width: 104px; height: 104px; flex: none; }
.lesson-card h3 { font-family: var(--font-display); font-weight: 600; font-size: 21px; margin: 0 0 4px; }
.lesson-card p { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.4; }
.rules { display: grid; gap: 10px; }
.rule { display: flex; gap: 12px; align-items: center; }
.rule .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.rule .ic svg { width: 30px; height: 30px; }
.rule p { margin: 0; font-size: 15px; line-height: 1.4; }
.tech { border-top: 1px solid var(--line); padding: 12px 0; }
.tech:first-of-type { border-top: 0; padding-top: 2px; }
.tech-h { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; }
.tech-h b { flex: 1; font-size: 16.5px; }
.tech-h .lvl { font-size: 12px; color: var(--ink-2); }
.tech-h svg { width: 18px; height: 18px; color: var(--ink-3); transition: transform .25s; }
.tech.open .tech-h svg { transform: rotate(90deg); }
.tech-b { display: none; gap: 12px; align-items: flex-start; margin-top: 10px; }
.tech.open .tech-b { display: flex; }
.tech-b .dg { width: 118px; flex: none; }
.tech-b p { margin: 0; font-size: 14.5px; line-height: 1.45; color: var(--ink-2); }

/* lesson overlay */
#lesson { position: absolute; top: 0; bottom: 0; width: 100%; max-width: 480px; display: flex; flex-direction: column; background: var(--bg); z-index: 12; animation: gameIn .34s cubic-bezier(.2, .8, .3, 1) both; }
.l-head { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top) + 8px) 14px 4px; flex: none; }
.l-prog { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.l-prog i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 4px; transition: width .45s cubic-bezier(.2, .9, .3, 1); }
.l-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 0; }
.l-card { flex: none; margin: 0 14px calc(env(safe-area-inset-bottom) + 14px); background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-2); padding: 16px 16px 14px; min-height: 172px; display: flex; flex-direction: column; }
.l-card .q { font-family: var(--font-display); font-size: 19.5px; font-weight: 600; line-height: 1.25; margin: 0 0 6px; }
.l-card .x { font-size: 15px; line-height: 1.45; color: var(--ink-2); margin: 0; }
.l-card .x b { color: var(--ink); }
.l-card .fb { font-size: 15px; line-height: 1.42; margin: 0; padding: 10px 12px; border-radius: 14px; animation: cardUp .25s ease-out both; }
.l-card .fb.ok { background: var(--sage-soft); }
.l-card .fb.no { background: var(--rose-soft); }
.l-card .fb .vd { display: block; font-weight: 700; margin-bottom: 2px; }
.l-card .fb b { font-weight: 650; }
.l-acts { display: flex; gap: 10px; margin-top: auto; padding-top: 14px; }
.l-acts .btn { height: 50px; }
.l-acts .btn + .btn { margin-top: 0; }
.tap-tip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--accent); font-weight: 600; margin-top: 10px; }
.tap-tip svg { width: 18px; height: 18px; }

/* welcome */
.welcome { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 28px); text-align: center; animation: viewIn .4s ease-out both; }
.welcome .art { width: 210px; height: 150px; }
.welcome h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; margin: 14px 0 8px; letter-spacing: -1px; }
.welcome-cap { font-size: 15px; font-weight: 600; color: var(--accent); margin: -2px 0 12px; }
.welcome p { color: var(--ink-2); font-size: 16.5px; line-height: 1.5; margin: 0 0 26px; max-width: 330px; }
.welcome .btn { max-width: 340px; }
.welcome { overflow-y: auto; -webkit-overflow-scrolling: touch; justify-content: flex-start; padding-bottom: 0; }
/* the content sits in one column: centred when it fits, scrolling (never squeezed) when it doesn't */
.w-inner { margin: auto 0; width: 100%; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; padding-bottom: calc(env(safe-area-inset-bottom) + 28px); }
.w-inner > * { flex-shrink: 0; }
.w-swap { animation: viewIn .3s ease-out both; }       /* new content fading in on a cover that stays put */
.welcome p.w-note { font-size: 13.5px; color: var(--ink-3); margin: 10px 0 0; }
.tip-icon { width: 64px; height: 64px; margin-bottom: 2px; flex: none; filter: drop-shadow(0 6px 14px rgba(20, 22, 48, .22)); }
/* Home Screen guide: a dropdown for the phone, then a short list of steps, each with a small picture */
.guide { width: 100%; max-width: 360px; margin: 0 auto; text-align: left; }
.guide-lead { font-size: 14.5px; color: var(--ink-2); margin: 0 2px 10px; }
.guide-pick { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; font-size: 14.5px; color: var(--ink-2); }
.sel-wrap { position: relative; display: inline-flex; min-width: 0; }
.guide-select { -webkit-appearance: none; appearance: none; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 34px 8px 12px; max-width: 100%; box-shadow: var(--shadow-1); }
.sel-wrap svg { position: absolute; right: 10px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); pointer-events: none; color: var(--ink-2); }
.gsteps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.gstep { display: flex; align-items: center; gap: 14px; }
.gthumb { position: relative; flex: none; width: 132px; height: 79px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.gthumb > svg { width: 100%; height: 100%; display: block; }
.gnum { position: absolute; left: -6px; top: -6px; width: 22px; height: 22px; border-radius: 11px; background: var(--primary); color: var(--primary-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.gtext { font-size: 15.5px; line-height: 1.4; color: var(--ink); }
.ill-bar, .ill-pop { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.2; }
.ill-mute { fill: var(--ink-3); }
.ill-t { font-family: var(--font-ui); font-size: 11.5px; fill: var(--ink); }
.ill-t.dim { fill: var(--ink-2); }
.ill-t.sm { font-size: 9.5px; }
.ill-t.xs { font-size: 8.8px; }
.ill-t.b { font-weight: 700; }
.ill-t.p { fill: var(--accent); font-weight: 700; }
.ill-hit { fill: var(--primary-soft); stroke: var(--accent); stroke-width: 2; }
.ill-ring { fill: none; stroke: var(--gold); stroke-width: 2.6; animation: pulseRing 1.6s ease-in-out infinite; }
.ill-icon { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ill-icon.faint { opacity: .35; }
.ill-dot { fill: var(--ink); }
.ill-on { fill: var(--sage); }
.ill-knob { fill: #FFFFFF; }

/* toast */
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 64px); transform: translate(-50%, -10px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 16px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 80; max-width: calc(100% - 40px); text-align: center; box-shadow: var(--shadow-2); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }


/* ---------------- board motion ---------------- */
.m { transform-box: fill-box; transform-origin: center; }
.m-dot-in { animation: dotIn .34s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: var(--d, 0ms); }
@keyframes dotIn { 0% { transform: scale(0); opacity: 0; } 55% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
.m-out { animation: mOut .2s ease-in both; }
@keyframes mOut { to { transform: scale(.2); opacity: 0; } }
.m-star-in { animation: starIn .28s cubic-bezier(.3, 1.3, .5, 1) both; }
@keyframes starIn { 0% { transform: scale(.4) rotate(-14deg); opacity: 0; } 60% { transform: scale(1.12) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
.m-shake { animation: shake .42s ease-in-out both; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
.fx-ripple { transform-box: fill-box; transform-origin: center; animation: ripple .6s ease-out both; animation-delay: var(--d, 0ms); }
@keyframes ripple { 0% { transform: scale(.28); opacity: 0; } 12% { opacity: .6; } 100% { transform: scale(1); opacity: 0; } }
.fx-glow { transform-box: fill-box; transform-origin: center; animation: glow .4s ease-out both; }
@keyframes glow { 0% { transform: scale(.2); opacity: .65; } 100% { transform: scale(1); opacity: 0; } }
.fx-spark { animation: spark .38s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes spark { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(.2); opacity: 0; } }
.fx-trail { transition: opacity .35s ease-out; }
.fx-trail.fade { opacity: 0 !important; }
.fx-halo { animation: halo 1.8s ease-in-out infinite; }
@keyframes halo { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
.fx-ghost { animation: ghost 1.6s ease-in-out infinite; }
@keyframes ghost { 0%, 100% { opacity: .95; } 50% { opacity: .4; } }
.fx-line { animation: drawLine 1.2s cubic-bezier(.4, .1, .3, 1) both; }
@keyframes drawLine { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
.fx-bead-glow { animation: glowPulse 2.4s ease-in-out 1.2s infinite alternate; }
@keyframes glowPulse { from { opacity: .35; } to { opacity: .85; } }
.fx-twinkle { animation: twinkle .7s ease-in-out both; animation-delay: var(--d, 0ms); }
@keyframes twinkle { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
.fx-spot { transition: opacity .3s; }
.fx-pulse { animation: pulseRing 1.6s ease-in-out infinite; }
@keyframes pulseRing { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.fx-ok { animation: okFlash .9s ease-out both; }
@keyframes okFlash { 0% { opacity: .0; } 25% { opacity: .9; } 100% { opacity: 0; } }

/* portrait only on short landscape phones */
.rotate { display: none; }
@media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
  .rotate { display: flex; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 100; background: var(--bg); color: var(--ink); flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-size: 17px; font-weight: 600; }
  .rotate svg { width: 60px; height: 60px; }
}
@media (max-width: 370px) {
  .view { padding-left: 14px; padding-right: 14px; }
  .greet h1, .page-title { font-size: 27px; }
  .tool { width: 66px; }
  .play-card .thumb { width: 80px; height: 80px; }
}
@media (max-height: 700px) {
  .greet { margin-top: 10px; }
  .card { padding: 15px; margin-top: 11px; }
  .g-tools { padding-bottom: calc(env(safe-area-inset-bottom) + 6px); }
  .progress { margin-top: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
}

/* ---------------- browsers on laptops and desktops ---------------- */
.view, .sheet-body, .welcome { scrollbar-width: none; }
.view::-webkit-scrollbar, .sheet-body::-webkit-scrollbar, .welcome::-webkit-scrollbar { display: none; }
/* Wide windows: the app keeps phone proportions in the middle of the window. Nothing is drawn
   around it, so it blends into the page. The transform makes #app the containing block for its
   fixed children (tab bar, sheets, toasts, welcome); the scrim is stretched to cover the window. */
@media (min-width: 600px) {
  #app {
    top: 50%; left: 50%; right: auto; bottom: auto;
    width: 430px; height: calc(100% - 48px); max-height: 900px;
    transform: translate(-50%, -50%);
  }
  .scrim { top: -100vh; right: -100vw; bottom: -100vh; left: -100vw; }
}
@media (min-width: 600px) and (max-height: 560px) {
  #app { height: 100%; }
}
@media (hover: hover) and (pointer: fine) {
  #board, #l-board { cursor: pointer; }
  .btn-primary:hover, .pill.primary:hover, .play-card:hover .go { filter: brightness(1.06); }
  .btn-soft:hover, .icon-btn:hover, .tool:not(:disabled):hover .tw, .pill:not(.primary):not(.ghost):hover, .cal-nav:hover, .pc-btn:hover, .pick:hover, .chip-streak:hover { filter: brightness(.97); }
  .btn-text:hover, .pill.ghost:hover { color: var(--ink); }
  .menu-item:hover, button.li:hover { background: var(--surface-2); }
  .tabbar button:not(.on):hover, .tiers button:not(.sel):hover, .mini-seg button:not(.sel):hover { color: var(--ink); }
}

</style>
</head>
<body>
<div id="app">
  <section class="view" id="v-play"></section>
  <section class="view" id="v-learn" hidden></section>
  <section class="view" id="v-stats" hidden></section>
  <section class="view" id="v-settings" hidden></section>

  <section id="game" hidden aria-label="Puzzle">
    <div class="g-head">
      <button class="icon-btn" id="g-back" aria-label="Back"></button>
      <div class="g-title"><div class="t" id="g-tier">Puzzle</div><div class="s"><span class="tags" id="g-sub"></span><span class="timer" id="timer"><span id="timer-ic"></span><span id="timer-t">0:00</span></span></div></div>
      <button class="icon-btn" id="g-more" aria-label="More"></button>
    </div>
    <div class="g-main" id="g-main">
      <div class="board-card" id="board-card"><div id="board"></div></div>
      <div class="progress" id="progress" aria-label="Stars placed"></div>
      <div class="hint-card" id="hint-card" hidden role="status"></div>
    </div>
    <div class="g-tools">
      <button class="tool" id="t-undo"><span class="tw"></span>Undo</button>
      <button class="tool" id="t-redo"><span class="tw"></span>Redo</button>
      <button class="tool" id="t-clear"><span class="tw"></span>Clear</button>
      <button class="tool hint" id="t-hint"><span class="tw"></span>Hint</button>
    </div>
  </section>

  <section id="lesson" hidden aria-label="How to play">
    <div class="l-head">
      <button class="icon-btn" id="l-close" aria-label="Close lesson"></button>
      <div class="l-prog" id="l-prog"><i></i></div>
    </div>
    <div class="l-main" id="l-main"><div class="board-card" id="l-board-card"><div id="l-board" style="width:100%;height:100%;touch-action:none"></div></div></div>
    <div class="l-card" id="l-card"></div>
  </section>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button data-tab="play" class="on"></button>
    <button data-tab="learn"></button>
    <button data-tab="stats"></button>
    <button data-tab="settings"></button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog"><div class="grabber"></div><div class="sheet-body" id="sheet-body"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<div class="rotate" aria-hidden="true"><span id="rotate-ic"></span><div>Rotate your phone to portrait</div></div>

<script id="engine">
/*
 * Star Battle (1 star) engine
 * ---------------------------------------------------------------
 * Rules: an N x N grid split into N regions. Place one star in every row,
 * every column and every region; no two stars may touch, not even

 *    always with the easiest technique that works. No guessing, no what-if

 *                      some row, column or region is empty

 *    independent uniqueness check.

function lRow(r) { var out = []; for (var c = 0; c < 6; c++) out.push(r * 6 + c); return out; }

function lAttacked(s) {
  var out = [], rs = (s / 6) | 0, cs = s % 6, reg = LESSON_REG;

}
